<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Angel — Mechatronics, AI and Data Science">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0716"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#120a25"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="nameClip">
      <text x="70" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
            font-size="86" font-weight="800" letter-spacing="12">ANGEL</text>
    </clipPath>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- ambient light -->
    <ellipse cx="180" cy="70" rx="300" ry="190" fill="url(#glowA)">
      <animate attributeName="cx" values="180;300;180" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="250" rx="320" ry="200" fill="url(#glowB)">
      <animate attributeName="cx" values="980;860;980" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- name -->
    <text x="70" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="86" font-weight="800" letter-spacing="12" fill="url(#nameGrad)">ANGEL</text>

    <!-- sheen sweep over the name -->
    <g clip-path="url(#nameClip)">
      <rect x="-320" y="40" width="240" height="140" fill="url(#sheen)" transform="skewX(-18)">
        <animate attributeName="x" from="-320" to="740" dur="4.5s" begin="1s"
                 repeatCount="indefinite" fill="freeze"/>
      </rect>
    </g>

    <rect x="72" y="168" width="330" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="72" y="206" font-family="Consolas, SF Mono, Menlo, monospace"
          font-size="16.5" letter-spacing="3.4" fill="#a5b4fc">MECHATRONICS ENGINEER</text>
    <text x="72" y="232" font-family="Consolas, SF Mono, Menlo, monospace"
          font-size="16.5" letter-spacing="3.4" fill="#64748b">AI &#183; DATA SCIENCE &#183; AUTOMATION</text>

    <!-- chips -->
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
      <g>
        <rect x="70" y="252" width="86" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.5"/>
        <text x="113" y="271" fill="#c4b5fd" text-anchor="middle">Python</text>
      </g>
      <g>
        <rect x="166" y="252" width="150" height="28" rx="14" fill="#22d3ee" fill-opacity="0.13" stroke="#22d3ee" stroke-opacity="0.45"/>
        <text x="241" y="271" fill="#a5f3fc" text-anchor="middle">Machine Learning</text>
      </g>
      <g>
        <rect x="326" y="252" width="96" height="28" rx="14" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-opacity="0.45"/>
        <text x="374" y="271" fill="#fcd34d" text-anchor="middle">Power BI</text>
      </g>
    </g>

    <!-- right-hand motif: gear ring + data bars -->
    <g transform="translate(985 150)">
      <circle r="118" fill="#7c3aed" fill-opacity="0.10" filter="url(#soft)"/>

      <!-- outer rotating dashed ring -->
      <g>
        <circle r="104" fill="none" stroke="#8b5cf6" stroke-opacity="0.55"
                stroke-width="2" stroke-dasharray="16 12" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </g>

      <!-- counter-rotating inner ring -->
      <g>
        <circle r="84" fill="none" stroke="#22d3ee" stroke-opacity="0.35"
                stroke-width="1.5" stroke-dasharray="4 10" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </g>

      <circle r="66" fill="#0d1117" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.09"/>

      <!-- data bars -->
      <g>
        <rect x="-38" y="4" width="14" height="26" rx="4" fill="url(#barGrad)" opacity="0.95">
          <animate attributeName="height" values="26;14;26" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="4;16;4" dur="3.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="-16" y="-12" width="14" height="42" rx="4" fill="url(#barGrad)" opacity="0.95">
          <animate attributeName="height" values="42;28;42" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-12;2;-12" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="6" y="-26" width="14" height="56" rx="4" fill="url(#barGrad)" opacity="0.95">
          <animate attributeName="height" values="56;38;56" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-26;-8;-26" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="28" y="-38" width="14" height="68" rx="4" fill="url(#barGrad)" opacity="0.95">
          <animate attributeName="height" values="68;50;68" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-38;-20;-38" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- orbiting node -->
      <g>
        <circle cx="104" cy="0" r="5" fill="#22d3ee"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="104" cy="0" r="3.5" fill="#c084fc"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="140" to="500" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- connector nodes -->
    <g stroke="#8b5cf6" stroke-opacity="0.35" fill="none" stroke-width="1.2">
      <path d="M470 96 L560 96 L600 56 L700 56"/>
      <path d="M470 214 L580 214 L620 250 L720 250"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="470" cy="96" r="3.5"/>
      <circle cx="700" cy="56" r="3.5"/>
      <circle cx="470" cy="214" r="3.5"/>
      <circle cx="720" cy="250" r="3.5"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
</svg>
